name: Compare Load Tests
on:
  workflow_call:
    inputs:
      gitRef:
        required: false
        type: string
        default: 'main'
        description: 'The git ref to checkout'
      path:
        required: true
        type: string
      baselineId:
        required: true
        type: string
      testId:
        required: true
        type: string
      node:
        required: true
        type: string
    outputs:
      summary:
        description: "Comparison report in Markdown"
        value: ${{ jobs.load.outputs.summary }}

  workflow_dispatch:
    inputs:
      gitRef:
        required: true
        type: string
        default: 'main'
        description: 'The git ref to checkout'
      path:
        required: true
        type: string
      baselineId:
        required: true
        type: string
      testId:
        required: true
        type: string
      node:
        required: true
        type: string

permissions:
  actions: read

jobs:
  load:
    name: Compare Load Tests
    runs-on: ubuntu-latest
    outputs:
      summary: ${{ steps.compare.outputs.summary }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{inputs.gitRef}}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{inputs.node}}

      - name: Install dependencies
        run: npm install --ignore-scripts --include=dev

      - name: Download baseline results
        uses: actions/download-artifact@v8
        with:
          # A PR comparison uses one run; separate manual runs keep the default test name.
          name: perf-load-${{inputs.baselineId == inputs.testId && 'baseline' || 'test'}}-${{inputs.baselineId}}-${{inputs.node}}
          path: ${{inputs.path}}/..
          run-id: ${{inputs.baselineId}}
          github-token: ${{secrets.GITHUB_TOKEN}}

      - name: Find baseline file
        id: baseline
        run: |
          ls -lah "${{inputs.path}}/results"
          echo "path=$(ls "${{inputs.path}}/results" | grep "result-.*\.json" | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Download test results
        uses: actions/download-artifact@v8
        with:
          name: perf-load-test-${{inputs.testId}}-${{inputs.node}}
          path: ${{inputs.path}}/..
          run-id: ${{inputs.testId}}
          github-token: ${{secrets.GITHUB_TOKEN}}

      - name: Find test file
        id: test
        run: |
           ls -lah "${{inputs.path}}/results"
           echo "path=$(ls "${{inputs.path}}/results" | grep "result-.*\.json" | grep -v "${{steps.baseline.outputs.path}}" | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Compare
        id: compare
        env:
          NODE_VERSION: ${{inputs.node}}
        run: |
          echo "### Node.js $NODE_VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          npm run compare -- "${{inputs.path}}/results/${{steps.baseline.outputs.path}}" "${{inputs.path}}/results/${{steps.test.outputs.path}}" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          delimiter="summary-$(node -p 'require("node:crypto").randomUUID()')"
          {
            echo "summary<<$delimiter"
            cat "$GITHUB_STEP_SUMMARY"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
          cp "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/comparison-$NODE_VERSION.md"

      - name: Upload comparison summary
        uses: actions/upload-artifact@v7
        with:
          name: perf-compare-${{github.run_id}}-${{inputs.node}}
          path: ${{runner.temp}}/comparison-${{inputs.node}}.md
          retention-days: 1
          if-no-files-found: error
