name: PR
on:
  pull_request:
    paths:
      - 'package[-lock].json'
      - '.github/workflows/**'
      - 'expf.config.json'
      - 'packages/**'
      - 'servers/**'
      - 'perf/load/**'
  workflow_call:

jobs:
  baseline:
    name: Run Baseline Load Tests (node ${{ matrix.node }})
    strategy:
      matrix:
        node: [18, 26]
    uses: ./.github/workflows/load.yml
    with:
      gitRef: ${{ github.event.pull_request.base.sha }}
      node: ${{ matrix.node }}
      test: '@expressjs/perf-load-example'

  test:
    name: Run Test Load Tests (node ${{ matrix.node }})
    strategy:
      matrix:
        node: [18, 26]
    uses: ./.github/workflows/load.yml
    with:
      gitRef: ${{ github.event.pull_request.head.sha }}
      node: ${{ matrix.node }}
      test: '@expressjs/perf-load-example'

  compare:
    name: Compare Load Tests (node ${{ matrix.node }})
    needs: [baseline, test]
    strategy:
      matrix:
        node: [18, 26]
    uses: ./.github/workflows/compare.yml
    with:
      gitRef: ${{ github.event.pull_request.head.sha }}
      path: ./perf/load/example
      baselineId: ${{ needs.baseline.outputs.runId }}
      testId: ${{ needs.test.outputs.runId }}
      node: ${{ matrix.node }}
    permissions:
      actions: read

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [compare]
    steps:
      - run: echo ${{ needs.compare.outputs.summary }} >> "$GITHUB_STEP_SUMMARY"
