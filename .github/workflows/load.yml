name: Load Test
on:
  workflow_call:
    inputs:
      gitRef:
        required: false
        type: string
        default: 'main'
        description: 'The git ref to checkout'
      node:
        required: false
        type: string
        default: '24'
        description: 'Node version to use, accepts semver ranges and some aliases like latest_lts'
      test:
        required: false
        type: string
        default: '@expressjs/perf-load-example'
      overrides:
        type: string
      flamegraph:
        required: false
        type: boolean
        default: false
        description: 'Generate a CPU flamegraph (requires Node.js >=22.6.0)'
    outputs:
      runId:
        description: "Run id for fetching artifacts"
        value: ${{github.run_id}}
      artifactName:
        description: "Artifact name for results"
        value: perf-load-${{inputs.gitRef == github.event.pull_request.base.sha && 'baseline' || 'test'}}-${{github.run_id}}-${{inputs.node}}
      flamegraphArtifactUrl:
        description: 'Download URL for the flamegraph artifact, when enabled'
        value: ${{jobs.load.outputs.flamegraphArtifactUrl}}

  workflow_dispatch:
    inputs:
      gitRef:
        required: true
        type: string
        default: 'main'
        description: 'The git ref to checkout'
      node:
        required: true
        type: string
        default: '24'
        description: 'Node version to use, accepts semver ranges and some aliases like latest_lts'
      test:
        required: true
        type: string
        default: '@expressjs/perf-load-example'
      overrides:
        type: string
      flamegraph:
        required: false
        type: boolean
        default: true
        description: 'Generate a CPU flamegraph (requires Node.js >=22.6.0)'

jobs:
  load:
    name: Load Test
    runs-on: ubuntu-latest
    outputs:
      flamegraphArtifactUrl: ${{steps.upload-flamegraphs.outputs.artifact-url}}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{inputs.gitRef}}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{inputs.node}}

      - name: Install dependencies
        run: npm install --ignore-scripts --include=dev --include=optional

      - name: Run load test
        env:
          OVERRIDES: ${{inputs.overrides || '{}'}}
          FLAMEGRAPH: ${{inputs.flamegraph}}
          TEST: ${{inputs.test}}
          NODE_VERSION: ${{inputs.node}}
        run: |
          profile_args=()
          if [[ "$FLAMEGRAPH" == "true" ]]; then
            profile_args+=(--flamegraph)
          fi
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          npm run load -- \
            --write \
            --parallel \
            --test="$TEST" \
            --node="$NODE_VERSION" \
            --overrides="$OVERRIDES" \
            "${profile_args[@]}" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        id: upload-results
        uses: actions/upload-artifact@v7
        with:
          # Both PR jobs share a run ID, so distinguish the base ref from the head ref.
          name: perf-load-${{inputs.gitRef == github.event.pull_request.base.sha && 'baseline' || 'test'}}-${{github.run_id}}-${{inputs.node}}
          path: ./perf/load/*/results/result-*.json
          retention-days: 1

      - name: Upload flamegraphs
        if: ${{inputs.flamegraph}}
        id: upload-flamegraphs
        uses: actions/upload-artifact@v7
        with:
          name: perf-flamegraphs-${{inputs.gitRef == github.event.pull_request.base.sha && 'baseline' || 'test'}}-${{github.run_id}}-${{inputs.node}}
          path: ./perf/load/*/results/result-*.flamegraph.html
          retention-days: 1
          if-no-files-found: error

      - name: Publish flamegraph link
        if: ${{inputs.flamegraph}}
        env:
          FLAMEGRAPH_URL: ${{steps.upload-flamegraphs.outputs.artifact-url}}
        run: |
          {
            echo '### CPU flamegraph'
            printf '[Download flamegraph HTML](%s)\n\n' "$FLAMEGRAPH_URL"
            echo 'Extract the downloaded archive and open the .flamegraph.html file in your browser.'
            echo 'Profiling was enabled for this run; use the same setting for both sides of a comparison.'
          } >> "$GITHUB_STEP_SUMMARY"
